name: Build XueJia OldBox APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: box-main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        run: |
          set -euo pipefail
          if [ ! -f .key/release.jks ]; then
            mkdir -p .key
            keytool -genkeypair -v -keystore .key/release.jks -alias xuejia -keyalg RSA -keysize 2048 -validity 20000 -storepass xuejiatv2026 -keypass xuejiatv2026 -dname "CN=XueJia TV, OU=Family, O=Xue, L=Manila, C=PH"
            git config user.name "fzxuehz"
            git config user.email "fzxuehz@users.noreply.github.com"
            git add -f .key/release.jks
            git commit -m "chore: add signing keystore"
            git push
          fi

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleArm64GenericNormalRelease assembleArmeabiGenericNormalRelease --no-daemon --stacktrace

      - name: Sign APKs
        run: |
          set -euo pipefail
          BT="$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)"
          mkdir -p dist
          for f in $(find app/build/outputs/apk -path "*generic*normal*" -name "*.apk" -type f); do
            base=$(basename "$f" .apk)
            cp "$f" "dist/${base}-signed.apk"
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks .key/release.jks --ks-key-alias xuejia --ks-pass pass:xuejiatv2026 --key-pass pass:xuejiatv2026 "dist/${base}-signed.apk"
          done
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: xuejia-oldbox-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30